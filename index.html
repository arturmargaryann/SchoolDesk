<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Կայքը թարմացվում է</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .icon {
            font-size: 50px;
            color: #3498db;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .footer {
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Կայքը ժամանակավորապես հասանելի չէ</h1>
        <p>Այս պահին մենք իրականացնում ենք պլանային տեխնիկական աշխատանքներ՝ կայքի որակը բարելավելու համար։ Խնդրում ենք փորձել մի փոքր ուշ։ Շնորհակալություն ընդառաջման համար։</p>
        <div class="footer">&copy; 2026 Բոլոր իրավունքները պաշտպանված են:</div>
    </div>

</body>
</html>
